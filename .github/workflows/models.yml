name: List models

# Lists OpenRouter models that support tool calling, with prices, and checks review/panels.json against
# them. Uses OpenRouter's public model list; no key needed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "review/panels.json"

permissions: {}

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I review/list_models.py --out models.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: models
          path: models.json
